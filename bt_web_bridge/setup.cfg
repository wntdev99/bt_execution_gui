[develop]
script_dir=$base/lib/bt_web_bridge
[install]
install_scripts=$base/lib/bt_web_bridge

# ament_flake8 reads this section. We relax the import-order (I100/I101)
# and inline-quote (Q000) rules — both are stylistic preferences not enforced
# by the Python community and impose high churn cost. PEP-8 mandatory rules
# (E5xx, W2xx) remain on.
[flake8]
max-line-length = 120
extend-ignore = I100,I101,I201,I202,Q000,Q001,Q003,W503,W504,D100,D101,D102,D103,D104,D105,D106,D107,D200,D203,D204,D205,D210,D213,D300,D301,D400,D401,D403,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414,D415,D416

# ament_pep257 reads this section (via pydocstyle).
[pydocstyle]
ignore = D100,D101,D102,D103,D104,D105,D106,D107,D200,D203,D204,D205,D210,D213,D300,D301,D400,D401,D403,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414,D415,D416
